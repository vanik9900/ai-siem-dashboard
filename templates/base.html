<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise AI SIEM</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@latest/dist/chart.umd.min.js"></script>
    <style>
        body { margin: 0; background-color: #0b0f19; color: #e2e8f0; font-family: sans-serif; display: flex; }
        .sidebar { width: 220px; height: 100vh; background: #0f172a; border-right: 1px solid #1e293b; padding: 20px; position: fixed; }
        .sidebar h2 { color: #38bdf8; font-size: 18px; margin-bottom: 30px; }
        .sidebar a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 0; font-weight: bold; }
        .sidebar a:hover { color: #38bdf8; }
        .content { margin-left: 260px; padding: 30px; width: 100%; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        th { background: #0f172a; color: #94a3b8; }
        .badge-red { color: #ef4444; background: #451a1a; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🛡️ SOC SIEM AI</h2>
        <a href="/">🔴 Real-Time Triage</a>
        <a href="/executive">📊 Executive Overview</a>
        <a href="/hunting">🔍 Threat Hunting</a>
        <a href="/soar">⚙️ SOAR & Isolation</a>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
